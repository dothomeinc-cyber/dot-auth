name: dot_auth
description: A powerful Flutter authentication package with phone OTP and email/password verification using Firebase. Plug-and-play, Riverpod-powered, go_router-ready.
version: 1.2.0
homepage: https://github.com/yourusername/dot_auth
repository: https://github.com/yourusername/dot_auth

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_auth: ^6.5.1
  firebase_core: ^4.13.0

  # Navigation
  go_router: ^17.3.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Forms
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  # UI
  phone_form_field: ^10.0.17
  pinput: ^6.0.2
  animations: ^2.2.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  mocktail: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

