name: dot_auth
description: A powerful Flutter authentication package with phone number OTP verification using Firebase. Features Riverpod state management, GoRouter integration, and customizable UI.
version: 1.0.0
homepage: https://github.com/yourusername/dot_auth
repository: https://github.com/yourusername/dot_auth
issue_tracker: https://github.com/yourusername/dot_auth/issues
documentation: https://github.com/yourusername/dot_auth/blob/main/README.md

funding:
  - https://github.com/sponsors/yourusername

topics:
  - authentication
  - firebase
  - phone-auth
  - riverpod
  - otp

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  phone_form_field: ^9.0.0
  pinput: ^4.0.0
  animations: ^2.0.0
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux: