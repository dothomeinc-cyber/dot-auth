name: dot_auth
description: A powerful Flutter authentication package with phone number OTP verification using Firebase.
version: 1.0.4
homepage: https://github.com/yourusername/dot_auth
repository: https://github.com/yourusername/dot_auth

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  phone_form_field: ^9.0.0
  pinput: ^4.0.0
  animations: ^2.0.0
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

false_secrets:
  - example/lib/firebase_options.dart
  - example/android/app/google-services.json
  - example/ios/Runner/GoogleService-Info.plist