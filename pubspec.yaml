name: dot_auth
description: A powerful Flutter authentication package with phone number OTP verification using Firebase.
version: 1.0.9  # Increment version

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  # Update these to newer versions
  phone_form_field: ^10.0.17  # Latest version
  pinput: ^6.0.2              # Match your app's version
  animations: ^2.0.0
  flutter_screenutil: ^5.9.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
