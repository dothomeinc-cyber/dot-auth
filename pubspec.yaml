name: dot_auth
description: A powerful Flutter authentication package with phone number OTP verification using Firebase.
version: 1.0.7  # Increment version

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  # Update these to newer versions
  phone_form_field: ^10.0.17  # Latest version
  pinput: ^6.0.2              # Match your app's version
  animations: ^2.0.0
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
