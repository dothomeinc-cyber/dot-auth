name: dot_auth_example
description: Example app for dot_auth package
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  flutter_screenutil: ^5.9.0
  dot_auth:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true