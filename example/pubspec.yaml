name: dot_auth_example
description: Example app demonstrating dot_auth package usage.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  dot_auth:
    path: ../
  firebase_core: ^4.9.0
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.3.0
  animations: ^2.2.0

flutter:
  uses-material-design: true
