name: dot_auth_example
description: Example app for dot_auth.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  dot_auth:
    path: ../

  firebase_core: ^4.13.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.3.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled so the app does not fetch the font at runtime. Drop the .ttf files
  # in example/assets/fonts/ or delete this block and the
  # DotAuthTypography.fontFamily line in main.dart.
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800
